name: RankPulse scans

on:
  schedule:
    # 1st of every month, 02:30 UTC (08:00 IST) — queue and scan every active site
    - cron: "30 2 1 * *"
    # every 20 minutes — pick up scans customers queued by hand
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      monthly:
        description: "Also queue a run for every active site"
        type: boolean
        default: false

concurrency:
  group: rankpulse-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The worker has its own package.json with a single dependency, so the
      # runner never installs Next, React or anything else the website needs.
      - name: Install worker dependencies
        run: npm install --no-audit --no-fund

      - name: Run scans
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRIGHTDATA_KEY: ${{ secrets.BRIGHTDATA_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          MONTHLY: ${{ github.event.schedule == '30 2 1 * *' || inputs.monthly }}
        run: |
          if [ "$MONTHLY" = "true" ]; then
            node run.mjs --monthly
          else
            node run.mjs
          fi
